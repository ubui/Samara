<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>离线 - {{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b1a17">
<link rel="shortcut icon" href="/static/img/favicon.ico">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #23221b 0%, #12110e 100%);
    color: #d8d3c4; font-family: "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 420px; }
  .dot { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 50%;
         border: 3px solid #4a4740; position: relative; }
  .dot:before { content: ""; position: absolute; inset: 10px; border-radius: 50%;
                background: #a83232; box-shadow: 0 0 18px rgba(168,50,50,.6); }
  h1 { font-size: 20px; margin: 0 0 10px; color: #eee9da; }
  p { font-size: 13.5px; line-height: 1.7; margin: 0 0 22px; color: #9a957f; }
  button {
    font-size: 14px; letter-spacing: 2px; color: #fafafa; cursor: pointer;
    padding: 10px 34px; border: 1px solid #799037; border-radius: 4px;
    background: radial-gradient(ellipse at center, #7eaa0f 0%, #6d8006 100%);
    box-shadow: inset 0 0 24px 0 #606f11, 0 0 3px 0 #9db134;
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>网络连接已断开</h1>
    <p>无法连接到 {{TITLE}} 面板。<br>
       请检查本机网络或 NAS 是否在线，恢复后点击下方按钮重新加载。</p>
    <button onclick="location.reload()">重新连接</button>
  </div>
</body>
</html>
