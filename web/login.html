<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录 - {{TITLE}}</title>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
<link rel="stylesheet" href="/static/css/style.css?v=1.1">
<link rel="shortcut icon" href="/static/img/favicon.ico">
<style>
  .background { position: fixed; inset: 0; background-size: cover; background-position: center; }
  .background:after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.25); }
  .main { color: #ccc; position: relative; z-index: 2; }
  .container { position: relative; }
  input { background-color: rgba(167,163,163,.65); box-shadow: inset 0 0 1px #000; }
  input[type="submit"] {
    font-size: 15px; letter-spacing: 5px; padding: 8px 0 8px 5px;
    cursor: pointer; width: 170px; white-space: nowrap; text-indent: 0;
  }
  /* 原 darkmatter 登录页按钮样式（定义在模板内联样式里，style.css 无此类） */
  .btn {
    display: inline-block; padding: 6px 32px; margin-bottom: 0; font-size: 14px;
    font-weight: 400; line-height: 14px; text-align: center; white-space: nowrap;
    vertical-align: middle; cursor: pointer; user-select: none;
    background-image: none; border: 1px solid transparent; border-radius: 4px;
  }
  .btn-primary {
    color: #fafafa !important;
    text-shadow: 0 1px 1px rgba(65,65,65,.4) !important;
    box-shadow: inset 0 0 24px 0 #606f11, 0 0 3px 0 #9db134 !important;
    border: 1px solid rgb(121,144,55) !important;
    background: #7eaa0f !important;
    background: radial-gradient(ellipse at center, #7eaa0f 0%, #6d8006 100%) !important;
  }
  .cbi-map { max-width: 460px; margin: 0 auto; padding: 26px 30px 30px;
             background: rgba(18,17,14,.55); border-radius: 6px;
             box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .cbi-value-title { width: 90px; text-align: right; color: #d8d3c4; }
  .cbi-input-user, .cbi-input-password { width: 240px; }
  .nsuite-error { max-width: 400px; margin: 0 auto 14px; padding: 9px 14px; border-radius: 3px;
               background: rgba(150,40,35,.9); color: #fff; font-size: 13px; }
  .nsuite-hint { max-width: 460px; margin: 18px auto 0; font-size: 11px; color: #cfcaba;
              text-align: center; line-height: 1.7; text-shadow: 0 1px 2px #000; }
</style>
</head>

<body class="lang_zh">

<div class="background" style="background-image:url(/static/img/default.jpg)"></div>

<div class="main" style="text-align:center">
  <div class="container">
    <form id="login-form" method="post" action="/login">
      <div class="cbi-map">
        <h2 name="content" style="text-align:center">{{TITLE}}</h2>

        <!--ERROR-->

        <div class="cbi-value">
          <label class="cbi-value-title">用户名</label>
          <div class="cbi-value-field">
            <input class="cbi-input-user" type="text" name="username" value="root"
                   autocomplete="username" autofocus required/>
          </div>
        </div>
        <div class="cbi-value cbi-value-last">
          <label class="cbi-value-title">密码</label>
          <div class="cbi-value-field">
            <input class="cbi-input-password" type="password" name="password"
                   autocomplete="current-password" required/>
          </div>
        </div>

        <div style="text-align:center; margin-top:35px; margin-bottom:0;">
          <input type="submit" value="登录" class="btn btn-primary" />
        </div>
      </div>
    </form>
    <div class="nsuite-hint">首次安装默认账号 root / root，请登录后立即修改</div>
  </div>
</div>

</body>
</html>
